{% extends 'layout.html' %}
{% block title %}Payment{% endblock %}

{% block body %}
<div class="container mt-5">
  <div class="card p-4 shadow">
    <h3 class="text-center text-primary">💳 Pay with Visa</h3>
    <p class="text-center mb-4">
      <strong>Amount:</strong> ${{ pending.total_price }}
    </p>

    <form method="POST"
          action="{{ url_for('bookings.payment') }}"
          onsubmit="return validatePaymentForm()">

      <div class="mb-3">
        <label>Card Holder Name</label>
        <input type="text"
               name="card_holder"
               id="card_holder"
               class="form-control"
               required>
      </div>
      <div class="mb-3">
        <label>Card Number</label>
        <input type="text"
               name="card_number"
               id="card_number"
               class="form-control"
               maxlength="16"
               required>
      </div>
      <div class="mb-3">
        <label>Expiry Date (MM/YY)</label>
        <input type="text"
               name="expiry"
               id="expiry"
               class="form-control"
               placeholder="MM/YY"
               required>
      </div>
      <div class="mb-3">
        <label>CVV</label>
        <input type="text"
               name="cvv"
               id="cvv"
               class="form-control"
               maxlength="4"
               required>
      </div>

      <button type="submit"
              class="btn btn-success w-100">
        Pay ${{ pending.total_price }}
      </button>
    </form>
  </div>
</div>

<script>
function validatePaymentForm() {
  const holder = document.getElementById('card_holder').value.trim();
  const number = document.getElementById('card_number').value.trim();
  const exp    = document.getElementById('expiry').value.trim();
  const cvv    = document.getElementById('cvv').value.trim();

  if (holder.length < 2) {
    alert("Please enter a valid card holder name.");
    return false;
  }
  if (!/^\d{16}$/.test(number)) {
    alert("Card number must be 16 digits.");
    return false;
  }
  if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp)) {
    alert("Expiry must be in MM/YY format.");
    return false;
  }
  const [m, y] = exp.split('/');
  const date   = new Date(`20${y}`, m);
  if (date < new Date()) {
    alert("Card expiry date is expired.");
    return false;
  }
  if (!/^\d{3,4}$/.test(cvv)) {
    alert("CVV must be 3 or 4 digits.");
    return false;
  }
  return true;
}
</script>
{% endblock %}
