{% extends 'layout.html' %}
{% block title %}Payment{% endblock %}
{% block body %}
<style>
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #f8f9fa;
    }
    
    .auth-wrapper {
        position: relative;
        min-height: calc(100vh - 180px);
        background-color: transparent;
        overflow: hidden;
        margin-top: 2rem;
        padding: 2rem 0;
    }
    
    .auth-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                    url("{{ url_for('static', filename='images/xavier-coiffic-lQ4mfS5Le6M-unsplash.jpg') }}") center/cover no-repeat fixed;
        z-index: -1;
    }
    
    .auth-card {
        position: relative;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        padding: 2rem;
        border-radius: 1.5rem;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.2);
        z-index: 1;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        max-width: 400px;
        margin: 0 auto;
    }
    
    .auth-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    .resort-logo {
        width: 60px;
        height: 60px;
        margin-bottom: 0.5rem;
        background: rgba(255,255,255,0.9);
        padding: 0.75rem;
        border-radius: 50%;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .welcome-text {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(45deg, #007bff, #00bcd4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.25rem;
    }
    
    .form-floating > .form-control {
        background-color: rgba(255, 255, 255, 0.9);
        border: 2px solid rgba(0,0,0,0.1);
        border-radius: 12px;
        height: calc(3rem + 2px);
        padding: 0.75rem 1rem;
        transition: all 0.3s ease;
    }
    
    .form-floating > .form-control:focus {
        box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
        border-color: var(--bs-primary);
        background-color: #fff;
    }
    
    .form-floating > label {
        padding: 0.75rem 1rem;
    }
    
    .btn-primary {
        padding: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 12px;
        background: linear-gradient(45deg, #007bff, #00bcd4);
        border: none;
        box-shadow: 0 5px 15px rgba(0,123,255,0.4);
        transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,123,255,0.6);
        background: linear-gradient(45deg, #0056b3, #008ba3);
    }
    
    .form-check-input:checked {
        background-color: var(--bs-primary);
        border-color: var(--bs-primary);
    }
    
    .text-primary {
        color: #007bff !important;
    }
    
    a.text-primary:hover {
        color: #0056b3 !important;
        text-decoration: none;
    }
    
    .form-floating {
        margin-bottom: 1rem;
    }
    
    .form-check {
        margin-bottom: 1rem;
    }
    
    .d-grid {
        margin-bottom: 1rem;
    }
    
    @media (max-width: 768px) {
        .auth-card {
            padding: 1.5rem;
            margin: 1rem;
        }
        .welcome-text {
            font-size: 1.75rem;
        }
        .auth-wrapper {
            padding: 1rem 0;
        }
    }
    </style>
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h3 class="text-center text-primary">💳 Pay with Visa</h3>
            <form method="POST" onsubmit="return validatePaymentForm()">
                <div class="mb-3">
                    <label>Card Holder Name</label>
                    <input type="text" name="card_holder" id="card_holder" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Card Number</label>
                    <input type="text" name="card_number" id="card_number" class="form-control" maxlength="16" required>
                </div>
                <div class="mb-3">
                    <label>Expiry Date (MM/YY)</label>
                    <input type="text" name="expiry" id="expiry" class="form-control" placeholder="MM/YY" required>
                </div>
                <div class="mb-3">
                    <label>CVV</label>
                    <input type="text" name="cvv" id="cvv" class="form-control" maxlength="4" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Pay ${{ booking.total_price }}</button>
            </form>
        </div>
    </div>
    
    <script>
    function validatePaymentForm() {
        const cardHolder = document.getElementById('card_holder').value.trim();
        const cardNumber = document.getElementById('card_number').value.trim();
        const expiry = document.getElementById('expiry').value.trim();
        const cvv = document.getElementById('cvv').value.trim();
    
        // Card Holder Name
        if (cardHolder.length < 2) {
            alert("Please enter a valid card holder name.");
            return false;
        }
    
        // Card Number
        const cardNumberRegex = /^\d{16}$/;
        if (!cardNumberRegex.test(cardNumber)) {
            alert("Card number must be 16 digits.");
            return false;
        }
    
        // Expiry Date
        const expiryRegex = /^(0[1-9]|1[0-2])\/\d{2}$/;
        if (!expiryRegex.test(expiry)) {
            alert("Expiry must be in MM/YY format.");
            return false;
        }
    
        // Validate expiry not in past
        const [month, year] = expiry.split('/');
        const expiryDate = new Date(`20${year}`, month);
        const now = new Date();
        if (expiryDate < now) {
            alert("Card expiry date is invalid or has passed.");
            return false;
        }
    
        // CVV
        const cvvRegex = /^\d{3,4}$/;
        if (!cvvRegex.test(cvv)) {
            alert("CVV must be 3 or 4 digits.");
            return false;
        }
    
        return true; // Valid!
    }
    </script>
    
{% endblock %}
